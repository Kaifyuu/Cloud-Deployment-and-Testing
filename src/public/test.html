<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User API Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #result { background: #f5f5f5; padding: 15px; border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>955108 - User API Test</h1>
  <form id="userForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Create User</button>
  </form>
  <button onclick="loadUsers()">Load All Users</button>
  <h2>Result:</h2>
  <div id="result">No data yet</div>

  <script>
    const form = document.getElementById('userForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };
      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        document.getElementById('result').textContent = JSON.stringify(json, null, 2);
        alert('User created successfully!');
      } catch (err) {
        document.getElementById('result').textContent = 'Error: ' + err.message;
      }
    });

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const json = await res.json();
        document.getElementById('result').textContent = JSON.stringify(json, null, 2);
      } catch (err) {
        document.getElementById('result').textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
