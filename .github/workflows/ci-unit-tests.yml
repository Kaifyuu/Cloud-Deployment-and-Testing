# CI Pipeline - Unit Tests
# 955108 Software Deployment - Part 2 Lab
# Runs automated unit tests on every push to main/master

name: CI - Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: |
          output=$(node dist/Test1.js 2>&1) || true
          echo "$output"
          exit_code=$(echo "$output" | tail -1)
          if [ "$exit_code" -ne 0 ]; then
            echo "Error: Unit tests failed with exit code $exit_code"
            exit 1
          fi
          echo "All unit tests passed!"
