name: Workflow 4

# ทำงานเมื่อ Workflow 2 หรือ 3 จบ แล้วเช็คว่าทั้งคู่สำเร็จแล้วค่อยรันจริง
on:
  workflow_run:
    workflows: ["Workflow 2", "Workflow 3"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  check-both:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Workflow 2 and 3 both succeeded for this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ok=true
          for wf in workflow2.yml workflow3.yml; do
            c=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?head_sha=$SHA&per_page=1" \
                  --jq '.workflow_runs[0].conclusion')
            echo "$wf -> $c"
            [ "$c" = "success" ] || ok=false
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"

  job1:
    needs: check-both
    if: ${{ needs.check-both.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Workflow 4 task
        run: echo "Workflow 4 running after Workflow 2 AND 3 completed"
