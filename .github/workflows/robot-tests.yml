# CI Pipeline - Robot Framework Tests
# 955108 Software Deployment - Software Testing Lab 11
# Runs Robot Framework automated tests

name: Robot Framework Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'robot-tests/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'robot-tests/**'
  workflow_dispatch:

jobs:
  robot-tests:
    name: Run Robot Framework Tests
    runs-on: ubuntu-latest

    services:
      app:
        image: node:20
        options: --health-cmd "echo healthy" --health-interval 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start application server
        run: |
          node dist/index.js &
          sleep 3
          curl -f http://localhost:3000/health || exit 1
          echo "✅ App server is running"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Robot Framework
        run: |
          pip install robotframework robotframework-requests robotframework-datadriver

      - name: Run Robot Framework API tests
        run: |
          cd robot-tests
          robot -d results -i API tests/ || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: robot-tests/results/
          retention-days: 30
