# Docker Compose - 955108 Software Deployment
# Part 4 Lab: Multi-container orchestration
# Express.js app + MySQL database

version: '3.8'

services:
  web:
    build: .
    container_name: 955108-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: 955108-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: deployment_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
