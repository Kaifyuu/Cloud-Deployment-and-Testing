services:
  web:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
       condition: service_healthy

api:
  build:
   context: ./api
   dockerfile: Dockerfile
  command: sh -c "npm run dev"
  ports:
   - "3000:3000"
  volumes:
    - ./api:/usr/src/app
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    interval: 10s
    timeout: 30s
    retries: 3
